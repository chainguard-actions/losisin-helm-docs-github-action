name: Test basic usage - generate helm docs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy chart fixture to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/chart" "$GITHUB_WORKSPACE/test-chart"

      - id: action
        uses: .
        with:
          chart-search-root: test-chart
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          version: v1.14.2

      - name: Assert README.md was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-chart/README.md" ]; then
            echo "FAIL: README.md was not generated"
            exit 1
          fi
          echo "PASS: README.md was generated"
          cat "$GITHUB_WORKSPACE/test-chart/README.md"

      - name: Assert README.md contains chart name
        run: |
          if ! grep -q "test-chart" "$GITHUB_WORKSPACE/test-chart/README.md"; then
            echo "FAIL: README.md does not contain chart name 'test-chart'"
            exit 1
          fi
          echo "PASS: README.md contains chart name"

      - name: Assert helm-docs output is set
        env:
          ACTUAL: ${{ steps.action.outputs.helm-docs }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: helm-docs output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: helm-docs binary not found at path: $ACTUAL"
            exit 1
          fi
          echo "PASS: helm-docs output is set to $ACTUAL"
