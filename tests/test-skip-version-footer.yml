name: Test skip-version-footer option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create temp chart directory for with-footer test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-chart-footer"
          cp "$GITHUB_WORKSPACE/tests/fixtures/chart/Chart.yaml" "$GITHUB_WORKSPACE/test-chart-footer/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/chart/values.yaml" "$GITHUB_WORKSPACE/test-chart-footer/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/chart/README.md.gotmpl" "$GITHUB_WORKSPACE/test-chart-footer/"

      - id: action-with-footer
        uses: .
        with:
          chart-search-root: test-chart-footer
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          skip-version-footer: 'false'

      - name: Capture and display README with footer
        run: |
          README="$GITHUB_WORKSPACE/test-chart-footer/README.md"
          echo "README with footer:"
          cat "$README"

      - name: Remove generated README for second run
        run: |
          rm -f "$GITHUB_WORKSPACE/test-chart-footer/README.md"

      - id: action-without-footer
        uses: .
        with:
          chart-search-root: test-chart-footer
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          skip-version-footer: 'true'

      - name: Assert README without footer does not contain helm-docs version line
        run: |
          README="$GITHUB_WORKSPACE/test-chart-footer/README.md"
          echo "README without footer:"
          cat "$README"
          if grep -q "Autogenerated from chart metadata using" "$README"; then
            echo "FAIL: README still contains helm-docs version footer"
            exit 1
          fi
          echo "PASS: README does not contain helm-docs version footer"

      - name: Assert README still contains chart content
        run: |
          README="$GITHUB_WORKSPACE/test-chart-footer/README.md"
          if ! grep -q "test-chart" "$README"; then
            echo "FAIL: README does not contain chart name"
            exit 1
          fi
          echo "PASS: README contains chart content"
