name: Test skip-version-footer option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare chart (no custom template) in temp location for footer test
        run: |
          mkdir -p /tmp/helm-test-footer
          cat > /tmp/helm-test-footer/Chart.yaml << 'EOF'
          apiVersion: v2
          name: test-chart-footer
          description: A test Helm chart for footer testing
          type: application
          version: 0.1.0
          appVersion: "1.0.0"
          EOF
          cat > /tmp/helm-test-footer/values.yaml << 'EOF'
          # -- Number of replicas
          replicaCount: 1
          EOF
          echo "Chart prepared at /tmp/helm-test-footer"
          ls -la /tmp/helm-test-footer

      - id: action-with-footer
        uses: .
        with:
          chart-search-root: /tmp/helm-test-footer
          values-file: values.yaml
          output-file: README.md
          skip-version-footer: 'false'
          git-push: 'false'
          fail-on-diff: 'false'

      - name: Assert README.md was generated with footer
        run: |
          if [ ! -f "/tmp/helm-test-footer/README.md" ]; then
            echo "FAIL: README.md was not generated"
            exit 1
          fi
          echo "README.md with footer:"
          cat /tmp/helm-test-footer/README.md
          if ! grep -qi "Autogenerated from chart metadata" /tmp/helm-test-footer/README.md; then
            echo "FAIL: README.md does not contain helm-docs footer"
            exit 1
          fi
          echo "PASS: README.md was generated with helm-docs footer"

      - name: Prepare chart (no custom template) in temp location for no-footer test
        run: |
          mkdir -p /tmp/helm-test-no-footer
          cat > /tmp/helm-test-no-footer/Chart.yaml << 'EOF'
          apiVersion: v2
          name: test-chart-no-footer
          description: A test Helm chart for no-footer testing
          type: application
          version: 0.1.0
          appVersion: "1.0.0"
          EOF
          cat > /tmp/helm-test-no-footer/values.yaml << 'EOF'
          # -- Number of replicas
          replicaCount: 1
          EOF
          echo "Chart prepared at /tmp/helm-test-no-footer"
          ls -la /tmp/helm-test-no-footer

      - id: action-without-footer
        uses: .
        with:
          chart-search-root: /tmp/helm-test-no-footer
          values-file: values.yaml
          output-file: README.md
          skip-version-footer: 'true'
          git-push: 'false'
          fail-on-diff: 'false'

      - name: Assert README.md was generated without footer
        run: |
          if [ ! -f "/tmp/helm-test-no-footer/README.md" ]; then
            echo "FAIL: README.md was not generated"
            exit 1
          fi
          echo "README.md without footer:"
          cat /tmp/helm-test-no-footer/README.md
          if grep -qi "Autogenerated from chart metadata" /tmp/helm-test-no-footer/README.md; then
            echo "FAIL: README.md contains helm-docs footer when skip-version-footer is true"
            exit 1
          fi
          echo "PASS: README.md was generated without helm-docs version footer"
