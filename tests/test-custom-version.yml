name: Test custom helm-docs version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Helm chart for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-chart"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-chart/Chart.yaml" <<'CHARTEOF'
          apiVersion: v2
          name: version-chart
          description: A chart to test custom helm-docs version
          type: application
          version: 0.1.0
          appVersion: "1.0.0"
          CHARTEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/version-chart/Chart.yaml"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-chart/values.yaml" <<'VALEOF'
          # -- Number of replicas
          replicaCount: 1
          VALEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/version-chart/values.yaml"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-chart/README.md.gotmpl" <<'TMPLEOF'
          # {{ .Name }}

          {{ .Description }}

          ## Values

          {{ template "chart.valuesSection" . }}
          TMPLEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/version-chart/README.md.gotmpl"

      - id: action
        uses: .
        with:
          chart-search-root: tests/fixtures/version-chart
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          version: 'v1.13.1'
          git-push: 'false'
          fail-on-diff: 'false'

      - name: Assert helm-docs output is set
        env:
          HELM_DOCS_PATH: ${{ steps.action.outputs.helm-docs }}
        run: |
          echo "helm-docs output: $HELM_DOCS_PATH"
          if [ -z "$HELM_DOCS_PATH" ]; then
            echo "FAIL: helm-docs output is empty"
            exit 1
          fi
          if [ ! -f "$HELM_DOCS_PATH" ]; then
            echo "FAIL: helm-docs binary not found at $HELM_DOCS_PATH"
            exit 1
          fi
          echo "PASS: helm-docs output is set and binary exists"

      - name: Assert correct version was installed
        env:
          HELM_DOCS_PATH: ${{ steps.action.outputs.helm-docs }}
        run: |
          echo "Checking helm-docs version..."
          VERSION_OUTPUT=$("$HELM_DOCS_PATH" --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.13.1"; then
            echo "PASS: correct version v1.13.1 was installed"
          else
            echo "FAIL: expected version 1.13.1 in output: $VERSION_OUTPUT"
            exit 1
          fi

      - name: Assert README.md was generated
        run: |
          README="$GITHUB_WORKSPACE/tests/fixtures/version-chart/README.md"
          if [ ! -f "$README" ]; then
            echo "FAIL: README.md was not generated"
            exit 1
          fi
          echo "README.md content:"
          cat "$README"
          echo "PASS: README.md was generated"
