name: Test fail-on-diff - action fails when docs are outdated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy chart fixture and create stale README
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/chart" "$GITHUB_WORKSPACE/test-chart-diff"
          # Create a stale/incorrect README.md so helm-docs will detect a diff
          echo "# stale-readme" > "$GITHUB_WORKSPACE/test-chart-diff/README.md"
          # Stage the stale README so git tracks it
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add "$GITHUB_WORKSPACE/test-chart-diff/README.md"
          git commit -m "add stale readme"

      - id: action
        uses: .
        with:
          chart-search-root: test-chart-diff
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          fail-on-diff: 'true'
          version: v1.14.2
        continue-on-error: true

      - name: Assert action failed due to diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to diff, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to diff"
