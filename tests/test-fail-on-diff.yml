name: Test fail-on-diff when docs are outdated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Helm chart with outdated README
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/diff-chart"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/Chart.yaml" <<'CHARTEOF'
          apiVersion: v2
          name: diff-chart
          description: A chart to test fail-on-diff
          type: application
          version: 0.1.0
          appVersion: "1.0.0"
          CHARTEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/Chart.yaml"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/values.yaml" <<'VALEOF'
          # -- Number of replicas
          replicaCount: 1

          # -- Service configuration
          service:
            # -- Service type
            type: ClusterIP
            # -- Service port
            port: 80
          VALEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/values.yaml"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/README.md.gotmpl" <<'TMPLEOF'
          # {{ .Name }}

          {{ .Description }}

          ## Values

          {{ template "chart.valuesSection" . }}
          TMPLEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/README.md.gotmpl"

          # Create an outdated README.md that doesn't match what helm-docs would generate
          cat > "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/README.md" <<'READMEEOF'
          # This is an outdated README that does not match helm-docs output
          This content is intentionally wrong to trigger fail-on-diff.
          READMEEOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/README.md"

          # Stage the outdated README so git sees it as committed
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add "$GITHUB_WORKSPACE/tests/fixtures/diff-chart/"
          git commit -m "add diff-chart fixture with outdated README"

      - id: action
        uses: .
        continue-on-error: true
        with:
          chart-search-root: tests/fixtures/diff-chart
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          fail-on-diff: 'true'

      - name: Assert action failed due to diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to diff, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to diff in README.md"
