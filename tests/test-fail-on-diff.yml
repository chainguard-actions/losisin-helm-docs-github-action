name: Test fail-on-diff behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          chart-search-root: tests/fixtures/chart
          values-file: values.yaml
          output-file: README.md
          template-files: README.md.gotmpl
          fail-on-diff: 'true'

      - name: Assert action failed due to diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to diff, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to diff"
